org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Works around a Kotlin Gradle Plugin bug on Windows where the incremental
# compilation cache's memory-mapped .tab files can't be closed cleanly
# (crashes with "Storage ... is already registered"). Disabling incremental
# Kotlin compilation avoids creating those caches at all.
kotlin.incremental=false
# Works around a separate Windows issue where Gradle's virtual file-system
# watcher/daemon caches a stale view of the .gradle transform cache after it
# gets cleared out from under a running daemon (surfaces as a
# FileNotFoundException from the l8DexDesugarLibDebug task for a file that
# genuinely exists on disk). Disabling VFS watching makes Gradle re-check
# the real filesystem instead of trusting its cached view.
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
